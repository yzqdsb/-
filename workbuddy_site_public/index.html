<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>
/* 打开时强制整页刷新一次：确保拿到最新 HTML 外壳与最新云端数据。
   防死循环：用 sessionStorage 打标，刷过一次就清掉标记；存储不可用时退回 URL 参数兜底。 */
(function () {
  var KEY = '__ledger_hard_reload__';
  var already = false;
  try { already = !!sessionStorage.getItem(KEY); } catch (e) {}

  if (already) {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    return;
  }

  // 已通过 URL 参数刷过一次：清掉参数，避免 URL 留痕
  if (/([?&])_r=1(&|$)/.test(location.search)) {
    try {
      var clean = location.href.replace(/([?&])_r=1(&|$)/, function (m, p1, p2) { return p2 ? p1 : ''; });
      clean = clean.replace(/[?&]$/, '');
      history.replaceState(null, '', clean);
    } catch (e) {}
    return;
  }

  try {
    sessionStorage.setItem(KEY, '1');
    location.reload();
    return;
  } catch (e) {}

  try {
    var url = location.href.split('#')[0];
    url += (url.indexOf('?') === -1 ? '?' : '&') + '_r=1';
    location.replace(url + (location.hash || ''));
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#a4232e">
<!-- 打开即最新：禁止浏览器缓存 HTML 外壳，每次都拉最新版本与最新数据 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>活动通知台账 · 华中师大马院 2024（本科）</title>
<style>
  /* ============ 设计令牌 ============
     方向：学院档案 / editorial 纸感
     暖米白纸底 · 衬线标题 · 细分隔线替代阴影 · 品牌红只作标识线
  */
  :root {
    /* 纸与墨 */
    --paper:        #fbf9f7;
    --paper-deep:   #f4efe9;
    --surface:      #fffefc;
    --ink:          #1f1d1b;   /* 15.8:1 on paper */
    --ink-2:        #4c4540;   /* 8.2:1 */
    --muted:        #6d665f;   /* 5.6:1 —— 达 WCAG AA */
    --muted-2:      #8a827a;   /* 仅用于非必要装饰文字 */
    --line:         #e4ddd4;
    --line-soft:    #efe9e1;

    /* 品牌 */
    --brand:        #a4232e;   /* 马院红 6.9:1 on paper */
    --brand-deep:   #7d1a23;
    --brand-wash:   #fbf1f1;
    --brand-line:   #f0dcdc;

    /* 语义 */
    --urgent:       #b3231f;
    --urgent-wash:  #fdeeee;
    --soon:         #9a5b12;
    --soon-wash:    #fdf3e5;
    --calm:         #4c6152;
    --calm-wash:    #eef3ee;

    /* 类型色（左标识条 + 圆点） */
    --t-college:    #a4232e;
    --t-normal:     #35618c;
    --t-volunteer:  #2f7350;
    --t-culture:    #a2661f;
    --t-honor:      #7b4a86;
    --t-recruit:    #2c6a72;
    --t-exam:       #a12d55;
    --t-other:      #8a827a;

    /* 排版 */
    --serif: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "Times New Roman", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

    /* 间距（4px 基准） */
    --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
    --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;

    --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --dur: 260ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--brand-wash); color: var(--brand-deep); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: var(--r-sm); }

  .page { max-width: 860px; margin: 0 auto; padding: 0 var(--s-4) calc(var(--s-12) + env(safe-area-inset-bottom)); }

  /* ============ 报头：改版前的红渐变样式 ============ */
  .masthead {
    position: relative; overflow: hidden;
    margin: 0 calc(-1 * var(--s-4));
    padding: calc(22px + env(safe-area-inset-top)) var(--s-5) 20px;
    background: linear-gradient(135deg, #7d1f2a 0%, #b02a37 55%, #c2432f 100%);
    color: #fff;
    border-radius: 0 0 22px 22px;
    box-shadow: 0 2px 10px rgba(20, 20, 30, .06);
  }
  /* 两枚装饰半透明圆 */
  .masthead::before, .masthead::after {
    content: ""; position: absolute; border-radius: 50%;
    background: rgba(255, 255, 255, .10); pointer-events: none;
  }
  .masthead::before { width: 180px; height: 180px; top: -70px; right: -40px; }
  .masthead::after  { width: 124px; height: 124px; bottom: -60px; left: -30px; background: rgba(255, 255, 255, .07); }

  .brand { position: relative; z-index: 1; display: flex; align-items: center; gap: var(--s-3); }
  .brand__logo {
    width: 46px; height: 46px; flex: 0 0 46px; border-radius: 50%;
    background: linear-gradient(145deg, #b8383e, #7d1a23);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .32), inset 0 -2px 4px rgba(0, 0, 0, .25);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255, 255, 255, .28);
  }
  .brand__title { font-size: 17px; font-weight: 700; letter-spacing: .3px; line-height: 1.3; }
  .brand__sub { font-size: 12px; opacity: .88; margin-top: 2px; }

  /* 统计卡：玻璃拟态，融进 header */
  .stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: var(--s-4); }
  .stat {
    background: rgba(255, 255, 255, .14);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 14px; padding: 12px 13px;
  }
  .stat__num { font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat__lbl { font-size: 12px; color: rgba(255, 255, 255, .85); margin-top: 2px; }
  .stat--todo .stat__num { color: #ffd3d6; }

  /* ============ 区块标题 ============ */
  .sec { margin-top: var(--s-8); }
  .sec__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-3); }
  .sec__title { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: .01em; }
  .sec__title .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); margin-right: 9px; vertical-align: 3px; }
  .sec__note { font-size: 11.5px; color: var(--muted-2); white-space: nowrap; }

  /* ============ 卡片容器（待处理改回带框的卡片）============ */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 2px 10px rgba(20, 20, 30, .05);
    padding: var(--s-4) var(--s-3); margin-top: var(--s-4);
  }
  .card__head { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-3); }
  .card__bar { flex: 0 0 4px; width: 4px; height: 16px; border-radius: 2px; background: var(--brand); }
  .card__title { font-size: 15px; font-weight: 700; }
  .card__note { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 500; }

  /* ============ 待处理清单 ============ */
  .todo { list-style: none; }
  .todo__item {
    position: relative; width: 100%; text-align: left;
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; margin-bottom: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    transition: transform 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .todo__item:hover, .todo__item:active {
    transform: translateY(-2px); box-shadow: 0 6px 18px rgba(20, 20, 30, .09);
  }
  .todo .skeleton { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .todo__idx {
    flex: 0 0 22px; width: 22px; height: 22px; border-radius: 7px; margin-top: 2px;
    background: linear-gradient(135deg, #c2432f 0%, #7d1f2a 100%);
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .todo__body { flex: 1 1 auto; min-width: 0; }
  .todo__name { font-size: 15px; font-weight: 600; line-height: 1.45; }
  .todo__meta { margin-top: 5px; display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-2); align-items: center; font-size: 12px; color: var(--muted); }
  .todo__meta .sep { color: var(--line); }
  .todo__deadline { font-variant-numeric: tabular-nums; }

  /* 倒计时徽标 */
  .cd {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cd--urgent { background: var(--urgent-wash); color: var(--urgent); }
  .cd--soon   { background: var(--soon-wash);  color: var(--soon); }
  .cd--calm   { background: var(--calm-wash);  color: var(--calm); }
  .cd--past   { background: #f2eee9;           color: var(--muted); }

  /* 类型圆点 */
  .tdot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; display: inline-block; }

  /* ============ 筛选控件 ============ */
  .controls { margin-top: var(--s-8); }
  .search { position: relative; }
  .search__icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted-2); pointer-events: none; }
  .search__input {
    width: 100%; height: 46px; padding: 0 42px 0 40px;
    font: inherit; font-size: 16px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .search__input::placeholder { color: var(--muted-2); }
  .search__input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(164,35,46,.10); }
  .search__clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border-radius: 50%; display: none;
    align-items: center; justify-content: center; color: var(--muted);
  }
  .search__clear.is-on { display: flex; }
  .search__clear:hover { background: var(--paper-deep); }

  .chips { display: flex; gap: var(--s-2); overflow-x: auto; padding: var(--s-1) 0 var(--s-2); margin-top: var(--s-3); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips__label { flex: 0 0 auto; align-self: center; font-size: 11.5px; color: var(--muted-2); padding-right: var(--s-1); }
  .chip {
    flex: 0 0 auto; min-height: 34px; padding: 6px 13px; border-radius: 999px;
    font-size: 13px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--line);
    transition: all 160ms var(--ease); white-space: nowrap;
  }
  .chip:hover { border-color: var(--muted-2); }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .chip--ghost { color: var(--brand); border-color: var(--brand-line); background: var(--brand-wash); }

  .filterbar { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); margin-top: var(--s-1); font-size: 12px; color: var(--muted); }

  /* ============ 归档 ============ */
  .year { margin-top: var(--s-8); }
  .year__head { display: flex; align-items: baseline; gap: var(--s-2); padding-bottom: var(--s-2); border-bottom: 1px solid var(--ink); }
  .year__num { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  .year__unit { font-size: 12px; color: var(--muted); }
  .year__count { margin-left: auto; font-size: 12px; color: var(--muted-2); font-variant-numeric: tabular-nums; }

  .month { border-bottom: 1px solid var(--line-soft); }
  .month__toggle {
    width: 100%; display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-4) var(--s-1); text-align: left;
    transition: background var(--dur) var(--ease);
  }
  .month__toggle:hover { background: rgba(255,255,255,.6); }
  .month__num { font-family: var(--serif); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 44px; }
  .month__unit { font-family: var(--serif); font-size: 13px; color: var(--muted); align-self: flex-end; padding-bottom: 2px; }
  .month__meta { flex: 1 1 auto; text-align: right; font-size: 12px; color: var(--muted); }
  .month__chev { flex: 0 0 18px; color: var(--muted); transition: transform var(--dur) var(--ease); }
  .month.is-open .month__chev { transform: rotate(90deg); }
  .month.is-open .month__num { color: var(--brand); }
  .month__panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur) var(--ease); }
  .month.is-open .month__panel { grid-template-rows: 1fr; }
  .month__panel > div { overflow: hidden; }
  .month__inner { padding: var(--s-1) 0 var(--s-3); }

  /* 通知条目：卡片化，每条独立成卡，带类型色条 */
  .entry {
    position: relative; width: 100%; text-align: left; display: block;
    margin-bottom: var(--s-3);
    padding: var(--s-4) var(--s-4) var(--s-4) calc(var(--s-4) + 10px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: 0 1px 3px rgba(20, 20, 30, .04);
    overflow: hidden;
    transition: transform 160ms var(--ease), box-shadow 160ms var(--ease), border-color 160ms var(--ease);
  }
  .entry:last-child { margin-bottom: 0; }
  /* 左侧类型标识色条：始终显示 */
  .entry::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: var(--bar, var(--t-other));
  }
  .entry:hover { border-color: var(--line); transform: translateY(-1px); box-shadow: 0 5px 16px rgba(20, 20, 30, .08); }
  .entry:active { transform: translateY(0); }
  .entry__name { font-size: 15.5px; font-weight: 600; line-height: 1.45; }
  .entry__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-2); }
  .entry__grid { display: grid; gap: 3px var(--s-5); margin-top: var(--s-3); font-size: 12.5px; color: var(--muted); }
  .entry__grid .k { color: var(--muted-2); margin-right: 5px; }
  .entry__summary { margin-top: var(--s-3); font-size: 13px; color: var(--ink-2); line-height: 1.68; padding-left: var(--s-3); border-left: 2px solid var(--line); }
  .entry.is-done { opacity: .62; }
  .entry.is-done .entry__name { text-decoration: line-through; text-decoration-color: var(--muted-2); }
  .entry.is-done .entry__grid, .entry.is-done .entry__summary { opacity: .75; }

  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .tag--type { background: var(--paper-deep); color: var(--ink-2); }
  .tag--join  { background: #eaf1f8; color: #2f5d84; }
  .tag--going { background: var(--calm-wash); color: var(--calm); }
  .tag--done  { background: #ece8e2; color: #8a827a; }
  .tag--cancel{ background: #f2eee9; color: var(--muted); text-decoration: line-through; }
  .tag--delay { background: #f2ecf6; color: #6b4a78; }

  /* ============ 状态 ============ */
  .empty { padding: var(--s-8) var(--s-2); text-align: center; color: var(--muted); font-size: 13.5px; }
  .empty__title { font-family: var(--serif); font-size: 15px; color: var(--ink-2); margin-bottom: 5px; }
  .skeleton { padding: var(--s-4) var(--s-3); border-bottom: 1px solid var(--line-soft); }
  .sk { background: linear-gradient(90deg, var(--paper-deep) 25%, #efe9e2 37%, var(--paper-deep) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: var(--r-sm); height: 13px; }
  .sk--t { height: 16px; width: 62%; margin-bottom: 10px; }
  .sk--s { width: 38%; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .banner { margin-top: var(--s-4); padding: var(--s-3) var(--s-4); border: 1px solid var(--brand-line); background: var(--brand-wash); border-radius: var(--r-md); font-size: 13px; color: var(--brand-deep); display: flex; align-items: center; gap: var(--s-3); }
  .banner button { margin-left: auto; text-decoration: underline; font-weight: 600; }

  /* ============ 详情：移动端底部 sheet / 桌面居中 ============ */
  .sheet { position: fixed; inset: 0; z-index: 100; display: none; }
  .sheet.is-open { display: block; }
  .sheet__scrim { position: absolute; inset: 0; background: rgba(28,24,22,.42); opacity: 0; transition: opacity var(--dur) var(--ease); }
  .sheet.is-shown .sheet__scrim { opacity: 1; }
  .sheet__panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--surface);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: var(--s-3) var(--s-5) calc(var(--s-6) + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform var(--dur) var(--ease);
    box-shadow: 0 -8px 40px rgba(28,24,22,.16);
  }
  .sheet.is-shown .sheet__panel { transform: translateY(0); }
  .sheet__grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto var(--s-4); }
  .sheet__close { position: absolute; top: var(--s-3); right: var(--s-3); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .sheet__close:hover { background: var(--paper-deep); }
  .sheet__title { font-family: var(--serif); font-size: 21px; font-weight: 700; line-height: 1.35; padding-right: var(--s-8); }
  .sheet__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-3); }
  .sheet__rows { margin-top: var(--s-5); border-top: 1px solid var(--line-soft); }
  .sheet__row { display: flex; gap: var(--s-3); padding: var(--s-3) 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .sheet__row .k { flex: 0 0 68px; color: var(--muted-2); }
  .sheet__row .v { flex: 1 1 auto; color: var(--ink); word-break: break-word; }
  .sheet__summary { margin-top: var(--s-4); padding: var(--s-4); background: var(--paper); border-radius: var(--r-md); font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }

  /* 页脚已按需求移除 */

  /* ============ 响应式 ============ */
  @media (min-width: 640px) {
    .entry__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .page { padding-left: var(--s-6); padding-right: var(--s-6); }
    .masthead { margin-left: calc(-1 * var(--s-6)); margin-right: calc(-1 * var(--s-6)); }
  }
  @media (min-width: 900px) {
    .sheet__panel { left: 50%; right: auto; bottom: auto; top: 50%; width: 620px; max-height: 84vh; transform: translate(-50%, -46%) scale(.98); border-radius: var(--r-lg); opacity: 0; transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease); }
    .sheet.is-shown .sheet__panel { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    .sheet__grip { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

        <dd class="stat__num" id="statMonth">—</dd>
        <dt class="stat__lbl">本月截止</dt>
      </div>
    </dl>
  </header>

    <section class="card" aria-labelledby="todoTitle">

        <input class="search__input" id="searchInput" type="search" placeholder="搜索活动名称、地点、关键词…" aria-label="搜索通知">
        <button class="search__clear" id="searchClear" aria-label="清空搜索">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="chips" role="group" aria-label="按类型筛选">
        <span class="chips__label">类型</span>
        <button class="chip" data-kind="type" data-value="" aria-pressed="true">全部</button>
      </div>
      <div class="chips" role="group" aria-label="按状态筛选">
        <span class="chips__label">状态</span>

      </div>

        <button class="chip chip--ghost" id="resetBtn" hidden>清除筛选</button>
      </div>

      <div class="sec__head">
        <h2 class="sec__title" id="archiveTitle">按月归档</h2>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">

</div>

<script>
(function () {
  'use strict';

  var ENDPOINT = 'https://huashi-activity-ledger.app.workbuddy.host';
  var PUBLISHABLE_KEY = 'wbpk_pCqNNBYf4VrEpZ94wW31ap_Kyere7lF45TH4HuK07YzS9LXuxjufbFg';
  var cloud = null;
  try {
    cloud = window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud({ endpoint: ENDPOINT, publishableKey: PUBLISHABLE_KEY });
  } catch (e) { cloud = null; }

  var TYPE_OPTIONS = ['学院活动', '师范培训', '志愿服务', '文体活动', '评优评先', '组织招新', '考试', '其他'];
  var STATUS_OPTIONS = ['待参加', '进行中', '已结束', '已取消', '已延期'];
  var TYPE_COLOR = {
    '学院活动': 'var(--t-college)', '师范培训': 'var(--t-normal)', '志愿服务': 'var(--t-volunteer)',
    '文体活动': 'var(--t-culture)', '评优评先': 'var(--t-honor)', '组织招新': 'var(--t-recruit)',
    '考试': 'var(--t-exam)', '其他': 'var(--t-other)'
  };
  var STATUS_CLASS = { '待参加': 'tag--join', '进行中': 'tag--going', '已结束': 'tag--done', '已取消': 'tag--cancel', '已延期': 'tag--delay' };

  var state = {
    rows: [], search: '', filterType: '', filterStatus: '',
    openMonths: {}, loading: true, error: false,
    rule: { 纳入状态: ['待参加', '进行中'], 仅未截止: true }
  };

  /* ---------- 工具 ---------- */
  function el(tag, cls, parent) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (parent) parent.appendChild(n);
    return n;
  }
  function pad2(n) { n = String(+n); return n.length < 2 ? '0' + n : n; }
  function val(row, f) { var v = row[f]; return (v === null || v === undefined) ? '' : v; }

  /* ---------- 数据 ---------- */
  function toRow(r) {
    return {
      id: r.id,
      活动名称: r.name || '', 活动类型: r.type || '', 状态: r.status || '',
      活动时间: r.act_time || '', 活动地点: r.place || '', 参与对象: r.target || '',
      报名方式: r.signup || '', 报名截止: r.deadline || '', 摘要: r.summary || ''
    };
  }
  function loadAll() {
    if (!cloud) return Promise.reject(new Error('云客户端未初始化'));
    return cloud.database.from('activities').select('*').order('id', { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        return (res.data || []).map(toRow);
      });
  }

  /* ---------- 日期解析 ---------- */
  function parseActivityYM(text) {
    if (!text) return null;
    var t = String(text).trim();
    var m1 = t.match(/(\d{4})[年\-\/](\d{1,2})/);
    if (m1) return { year: m1[1], month: pad2(m1[2]) };
    var m2 = t.match(/(\d{1,2})[月\-\/](\d{1,2})/);
    if (m2) return { year: String(new Date().getFullYear()), month: pad2(m2[1]) };
    var m3 = t.match(/(\d{1,2})月/);
    if (m3) return { year: String(new Date().getFullYear()), month: pad2(m3[1]) };
    return null;
  }
  function getGroupYM(row) { return parseActivityYM(val(row, '活动时间')) || parseActivityYM(val(row, '报名截止')); }

  // 返回 { ts, level, label }；解析不出返回 null
  // 注意：截止字段常含多个日期（如「报名 10-21；材料提交 10-31」），
  // 必须逐个解析，取「下一个还没过的截止点」，否则首个日期一过整条就被误判为已截止。
  function deadlineInfo(deadlineText, actText) {
    function parseDates(s) {
      if (!s) return [];
      var t = String(s).trim();
      if (!t || t === '无' || t === '信息缺失' || t === '待定') return [];
      var out = [], spans = [], m;
      // 先取带年份的完整日期，并记录它们占用的区间，避免被下面的短格式重复匹配
      var reFull = /(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?/g;
      while ((m = reFull.exec(t))) {
        spans.push([m.index, m.index + m[0].length]);
        out.push({ y: +m[1], m: +m[2], d: +m[3], end: m.index + m[0].length });
      }
      // 再取省略年份的短日期（10-15、11月1日）
      var reShort = /(\d{1,2})[-/月](\d{1,2})日?/g;
      while ((m = reShort.exec(t))) {
        var covered = false;
        for (var i = 0; i < spans.length; i++) {
          if (m.index >= spans[i][0] && m.index < spans[i][1]) { covered = true; break; }
        }
        if (covered) continue;
        out.push({ y: new Date().getFullYear(), m: +m[1], d: +m[2], end: m.index + m[0].length });
      }
      var seen = {};
      return out.filter(function (p) {
        if (p.m < 1 || p.m > 12 || p.d < 1 || p.d > 31) return false;
        // 时间取该日期紧跟着的 HH:MM（如「10-31 12:00」），没有则按当日 23:59 计
        var tail = t.slice(p.end, p.end + 10);
        var mt = tail.match(/^[^\d]{0,3}(\d{1,2}):(\d{2})/);
        p.hh = mt ? +mt[1] : 23;
        p.mi = mt ? +mt[2] : 59;
        p.ts = new Date(p.y, p.m - 1, p.d, p.hh, p.mi).getTime();
        if (isNaN(p.ts)) return false;
        var k = p.y + '-' + p.m + '-' + p.d + '-' + p.hh + '-' + p.mi;
        if (seen[k]) return false;
        seen[k] = 1;
        return true;
      });
    }

    // 优先用截止字段里的日期；一个都没解析出来时，才退回活动时间里的日期
    var list = parseDates(deadlineText);
    if (!list.length) list = parseDates(actText);
    if (!list.length) return null;

    var nowTs = Date.now();
    var future = list.filter(function (p) { return p.ts >= nowTs; });
    var p = future.length
      ? future.reduce(function (a, b) { return a.ts <= b.ts ? a : b; })  // 还有没过的：取最近的那个截止点
      : list.reduce(function (a, b) { return a.ts >= b.ts ? a : b; });  // 全都过了：取最后那个
    var ts = p.ts;
    // 按日历日比较：同一天=今天截止，次日=明天截止（不受当前时刻影响）
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var dayDiff = Math.floor((new Date(p.y, p.m - 1, p.d).getTime() - todayStart) / 86400000);
    var level, label;
    if (ts < Date.now()) { level = 'past'; label = '已截止'; }
    else if (dayDiff === 0) { level = 'urgent'; label = '今天截止'; }
    else if (dayDiff === 1) { level = 'urgent'; label = '明天截止'; }
    else if (dayDiff <= 3) { level = 'soon'; label = '剩 ' + dayDiff + ' 天'; }
    else { level = 'calm'; label = '剩 ' + dayDiff + ' 天'; }
    // dayStart：截止日当天 00:00，供「本周/本月截止」按日历日归类（避免 24:00 被算到次日）
    var dayStart = new Date(p.y, p.m - 1, p.d).getTime();
    return { ts: ts, dayStart: dayStart, days: dayDiff, level: level, label: label };
  }
  function isPending(row) {
    if (state.rule.纳入状态.indexOf(val(row, '状态')) === -1) return false;
    var info = deadlineInfo(val(row, '报名截止'), val(row, '活动时间'));
    if (state.rule.仅未截止 && info && info.ts < Date.now()) return false;
    return true;
  }
  function buildPending(rows) {
    return rows.filter(isPending).map(function (r) {
      return { row: r, info: deadlineInfo(val(r, '报名截止'), val(r, '活动时间')) };
    }).sort(function (a, b) {
      var ta = a.info ? a.info.ts : Infinity, tb = b.info ? b.info.ts : Infinity;
      return ta - tb;
    });
  }

  /* ---------- 分组 / 筛选 ---------- */
  function sortRows(rows) {
    return rows.slice().sort(function (a, b) {
      var ya = getGroupYM(a), yb = getGroupYM(b);
      if (!ya && !yb) return 0;
      if (!ya) return 1;
      if (!yb) return -1;
      var ta = ya.year + ya.month, tb = yb.year + yb.month;
      return ta > tb ? -1 : (ta < tb ? 1 : 0);
    });
  }
  function groupByYearMonth(rows) {
    var map = {}, unknown = [];
    rows.forEach(function (r) {
      var ym = getGroupYM(r);
      if (!ym) { unknown.push(r); return; }
      if (!map[ym.year]) map[ym.year] = {};
      if (!map[ym.year][ym.month]) map[ym.year][ym.month] = [];
      map[ym.year][ym.month].push(r);
    });
    var out = [];
    Object.keys(map).sort(function (a, b) { return b.localeCompare(a); }).forEach(function (y) {
      out.push({
        year: y,
        months: Object.keys(map[y]).sort(function (a, b) { return b.localeCompare(a); })
          .map(function (m) { return { month: m, rows: sortRows(map[y][m]) }; })
      });
    });
    // 兜底：解析不出日期的记录并入最新月份分组，不再单独成组。
    // （写入时已约定活动时间必须带月份，此分支仅防御历史脏数据，避免丢记录。）
    if (unknown.length) {
      if (out.length) {
        out[0].months[0].rows = out[0].months[0].rows.concat(unknown);
      } else {
        var now = new Date();
        out.push({
          year: String(now.getFullYear()),
          months: [{ month: pad2(now.getMonth() + 1), rows: unknown }]
        });
      }
    }
    return out;
  }
  function filterRows(rows) {
    var q = state.search.trim().toLowerCase();
    return rows.filter(function (r) {
      if (state.filterType && val(r, '活动类型') !== state.filterType) return false;
      if (state.filterStatus && val(r, '状态') !== state.filterStatus) return false;
      if (q) {
        var hay = [val(r, '活动名称'), val(r, '摘要'), val(r, '活动地点'), val(r, '活动时间'), val(r, '参与对象')].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }
  function isFiltering() { return !!(state.search.trim() || state.filterType || state.filterStatus); }

  /* ---------- 渲染：指标 ---------- */
  function renderStats(rows) {
    var pending = buildPending(rows);
    document.getElementById('statPending').textContent = pending.length;

    // 本周截止：本周一 00:00 ~ 本周日 23:59:59 之间截止的待处理事项
    // 本月截止：本月 1 号 00:00 ~ 本月最后一天 23:59:59 之间截止的待处理事项
    var now = new Date();
    var weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var dow = weekStart.getDay(); // 0=周日 … 6=周六
    var offsetToMonday = (dow === 0) ? -6 : (1 - dow);
    weekStart.setDate(weekStart.getDate() + offsetToMonday);
    weekStart.setHours(0, 0, 0, 0);

    var monthStart = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
    var monthEndDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getTime(); // 本月最后一天 00:00

    var week = 0, month = 0;
    pending.forEach(function (p) {
      if (!p.info) return;
      // 按「截止日」而非精确时刻归类：11-01 24:00 属于 11-01 当天，仍算本周
      var day = (p.info.dayStart !== undefined) ? p.info.dayStart : p.info.ts;
      if (day >= weekStart.getTime() && day <= weekStart.getTime() + 6 * 86400000) week++;
      if (day >= monthStart.getTime() && day <= monthEndDay) month++;
    });
    document.getElementById('statWeek').textContent = week;
    document.getElementById('statMonth').textContent = month;
  }

  /* ---------- 渲染：待处理 ---------- */
  function renderPending(rows) {
    var box = document.getElementById('pendingList');
    box.textContent = '';
    if (state.loading) {
      [0, 1, 2].forEach(function () {
        var li = el('li', 'skeleton', box);
        el('div', 'sk sk--t', li);
        el('div', 'sk sk--s', li);
      });
      return;
    }
    if (state.error) {
      var liE = el('li', 'empty', box);
      el('div', 'empty__title', liE).textContent = '通知加载失败';
      el('div', '', liE).textContent = '请检查网络后点击右上角「重试」';
      return;
    }
    var list = buildPending(rows);
    if (!list.length) {
      var li0 = el('li', 'empty', box);
      el('div', 'empty__title', li0).textContent = '暂无待处理事项';
      el('div', '', li0).textContent = '所有通知均已报名或已过期';
      return;
    }
    list.forEach(function (item, i) {
      var r = item.row;
      var li = el('li', '', box);
      var btn = el('button', 'todo__item', li);
      btn.type = 'button';
      el('span', 'todo__idx', btn).textContent = pad2(i + 1);

      var body = el('div', 'todo__body', btn);
      el('div', 'todo__name', body).textContent = val(r, '活动名称') || '(未命名)';

      var meta = el('div', 'todo__meta', body);
      var ty = val(r, '活动类型');
      if (ty) {
        var tw = el('span', '', meta);
        tw.style.display = 'inline-flex';
        tw.style.alignItems = 'center';
        tw.style.gap = '5px';
        var dot = el('span', 'tdot', tw);
        dot.style.background = TYPE_COLOR[ty] || 'var(--t-other)';
        el('span', '', tw).textContent = ty;
      }
      if (item.info) {
        var cd = el('span', 'cd cd--' + item.info.level, meta);
        cd.textContent = item.info.label;
      }
      var dl = val(r, '报名截止');
      if (dl && dl !== '无' && dl !== '信息缺失') {
        el('span', 'sep', meta).textContent = '·';
        el('span', 'todo__deadline', meta).textContent = dl;
      }
      btn.addEventListener('click', function () { openSheet(r); });
    });
  }

  /* ---------- 渲染：归档 ---------- */
  function renderLedger(rows) {
    var box = document.getElementById('ledger');
    box.textContent = '';
    if (state.loading) {
      [0, 1].forEach(function () {
        var s = el('div', 'skeleton', box);
        el('div', 'sk sk--t', s);
        el('div', 'sk sk--s', s);
      });
      return;
    }
    if (state.error) {
      var e0 = el('div', 'empty', box);
      el('div', 'empty__title', e0).textContent = '通知加载失败';
      el('div', '', e0).textContent = '请检查网络后点击右上角「重试」';
      return;
    }
    var filtered = filterRows(rows);
    if (!filtered.length) {
      var e = el('div', 'empty', box);
      el('div', 'empty__title', e).textContent = isFiltering() ? '没有符合条件的通知' : '暂无活动通知';
      el('div', '', e).textContent = isFiltering() ? '试试换个关键词，或清除筛选条件' : '群内暂无已整理的通知';
      return;
    }
    var autoOpen = isFiltering();
    groupByYearMonth(filtered).forEach(function (year) {
      var yw = el('div', 'year', box);
      var head = el('div', 'year__head', yw);
      el('span', 'year__num', head).textContent = year.year;
      el('span', 'year__unit', head).textContent = '年';
      var total = year.months.reduce(function (s, m) { return s + m.rows.length; }, 0);
      el('span', 'year__count', head).textContent = total + ' 条';

      year.months.forEach(function (mo) {
        var key = year.year + '|' + mo.month;
        var open = autoOpen || !!state.openMonths[key];
        var mw = el('div', 'month' + (open ? ' is-open' : ''), box);

        var tg = el('button', 'month__toggle', mw);
        tg.type = 'button';
        tg.setAttribute('aria-expanded', open ? 'true' : 'false');
        el('span', 'month__num', tg).textContent = parseInt(mo.month, 10);
        el('span', 'month__unit', tg).textContent = '月';
        var meta = el('span', 'month__meta', tg);
        meta.textContent = mo.rows.length + ' 条';
        var chev = el('span', 'month__chev', tg);
        chev.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';

        var panel = el('div', 'month__panel', mw);
        var innerWrap = el('div', '', panel);
        var inner = el('div', 'month__inner', innerWrap);
        mo.rows.forEach(function (r) { renderEntry(r, inner); });

        tg.addEventListener('click', function () {
          var willOpen = !mw.classList.contains('is-open');
          mw.classList.toggle('is-open', willOpen);
          tg.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
          state.openMonths[key] = willOpen;
        });
      });
    });
  }

  function renderEntry(r, parent) {
    var st = val(r, '状态');
    var btn = el('button', 'entry' + (st === '已结束' || st === '已取消' ? ' is-done' : ''), parent);
    btn.type = 'button';
    btn.style.setProperty('--bar', TYPE_COLOR[val(r, '活动类型')] || 'var(--t-other)');

    el('div', 'entry__name', btn).textContent = val(r, '活动名称') || '(未命名)';

    var tags = el('div', 'entry__tags', btn);
    if (val(r, '活动类型')) el('span', 'tag tag--type', tags).textContent = val(r, '活动类型');
    var sb = el('span', 'tag ' + (STATUS_CLASS[st] || 'tag--done'), tags);
    sb.textContent = st || '未知';
    var info = deadlineInfo(val(r, '报名截止'), val(r, '活动时间'));
    if (info && info.level !== 'past') {
      var cd = el('span', 'cd cd--' + info.level, tags);
      cd.textContent = info.label;
    }

    var grid = el('div', 'entry__grid', btn);
    function frow(k, v) {
      if (!v) return;
      var f = el('div', '', grid);
      var kk = el('span', 'k', f); kk.textContent = k + ' ';
      el('span', '', f).textContent = v;
    }
    frow('时间', val(r, '活动时间'));
    frow('地点', val(r, '活动地点'));
    frow('对象', val(r, '参与对象'));
    frow('截止', val(r, '报名截止'));

    if (val(r, '摘要')) el('div', 'entry__summary', btn).textContent = val(r, '摘要');
    btn.addEventListener('click', function () { openSheet(r); });
  }

  /* ---------- 详情 sheet ---------- */
  var lastFocused = null;
  function openSheet(r) {
    var sheet = document.getElementById('sheet');
    lastFocused = document.activeElement;
    document.getElementById('sheetTitle').textContent = val(r, '活动名称') || '(未命名)';

    var tags = document.getElementById('sheetTags');
    tags.textContent = '';
    if (val(r, '活动类型')) el('span', 'tag tag--type', tags).textContent = val(r, '活动类型');
    var st = val(r, '状态');
    el('span', 'tag ' + (STATUS_CLASS[st] || 'tag--done'), tags).textContent = st || '未知';
    var info = deadlineInfo(val(r, '报名截止'), val(r, '活动时间'));
    if (info) {
      var cd = el('span', 'cd cd--' + info.level, tags);
      cd.textContent = info.label;
    }

    var rows = document.getElementById('sheetRows');
    rows.textContent = '';
    function srow(k, v) {
      if (!v) return;
      var row = el('div', 'sheet__row', rows);
      el('span', 'k', row).textContent = k;
      el('span', 'v', row).textContent = v;
    }
    srow('活动时间', val(r, '活动时间'));
    srow('活动地点', val(r, '活动地点'));
    srow('参与对象', val(r, '参与对象'));
    srow('报名方式', val(r, '报名方式'));
    srow('报名截止', val(r, '报名截止'));

    var sum = document.getElementById('sheetSummary');
    if (val(r, '摘要')) { sum.textContent = val(r, '摘要'); sum.hidden = false; } else { sum.hidden = true; }

    document.body.style.overflow = 'hidden';
    sheet.classList.add('is-open');
    sheet.setAttribute('aria-hidden', 'false');
    requestAnimationFrame(function () {
      sheet.classList.add('is-shown');
      document.getElementById('sheetClose').focus();
    });
  }
  function closeSheet() {
    var sheet = document.getElementById('sheet');
    if (!sheet.classList.contains('is-open')) return;
    sheet.classList.remove('is-shown');
    sheet.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    window.setTimeout(function () { sheet.classList.remove('is-open'); }, 260);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  /* ---------- 筛选条 ---------- */
  function renderFilterState() {
    var chipLists = document.querySelectorAll('.chips');
    for (var i = 0; i < chipLists.length; i++) {
      var chips = chipLists[i].querySelectorAll('.chip');
      for (var j = 0; j < chips.length; j++) {
        var isType = chips[j].getAttribute('data-kind') === 'type';
        var active = isType ? (chips[j].getAttribute('data-value') === state.filterType)
                            : (chips[j].getAttribute('data-value') === state.filterStatus);
        chips[j].setAttribute('aria-pressed', active ? 'true' : 'false');
      }
    }
    var summary = document.getElementById('filterSummary');
    var reset = document.getElementById('resetBtn');
    if (isFiltering()) {
      var parts = [];
      if (state.filterType) parts.push(state.filterType);
      if (state.filterStatus) parts.push(state.filterStatus);
      if (state.search.trim()) parts.push('“' + state.search.trim() + '”');
      summary.textContent = '已筛选：' + parts.join(' · ');
      reset.hidden = false;
    } else {
      summary.textContent = '';
      reset.hidden = true;
    }
    document.getElementById('searchClear').classList.toggle('is-on', !!state.search);
  }

  function renderAll() {
    renderStats(state.rows);
    renderPending(state.rows);
    renderLedger(state.rows);
    renderFilterState();
  }

  function showBanner(msg) {
    var box = document.getElementById('loadBanner');
    box.textContent = '';
    var b = el('div', 'banner', box);
    el('span', '', b).textContent = msg;
    var btn = el('button', '', b);
    btn.type = 'button';
    btn.textContent = '重试';
    btn.addEventListener('click', function () { box.textContent = ''; refresh(); });
  }

  function refresh() {
    state.loading = true; state.error = false;
    renderAll();
    loadAll().then(function (rows) {
      state.rows = rows; state.loading = false;
      renderAll();
    }).catch(function (err) {
      console.error('[db] 加载失败', err);
      state.loading = false; state.error = true;
      renderAll();
      showBanner('通知加载失败，请检查网络后重试');
    });
  }

  /* ---------- 静默刷新：打开即最新 ---------- */
  // 不显示骨架屏、失败不打断已有内容，只把最新数据悄悄换上去。
  function silentRefresh() {
    if (state.loading) return;                              // 首次加载中，别抢
    if (document.querySelector('.sheet.is-shown')) return;  // 详情弹窗打开时不刷新，避免内容跳变
    if (document.hidden) return;
    loadAll().then(function (rows) {
      state.rows = rows;
      state.error = false;
      renderAll();
    }).catch(function () { /* 静默失败：保留当前内容，下次再试 */ });
  }

  // 切回页面 / 网络恢复 / 每分钟兜底，都会重新拉一次云端数据
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) silentRefresh();
  });
  window.addEventListener('focus', silentRefresh);
  window.addEventListener('online', silentRefresh);
  setInterval(silentRefresh, 60000);

  /* ---------- 启动 ---------- */
  function buildChips() {
    var typeWrap = document.querySelectorAll('.chips')[0];
    var statusWrap = document.querySelectorAll('.chips')[1];
    TYPE_OPTIONS.forEach(function (t) {
      var b = el('button', 'chip', typeWrap);
      b.type = 'button'; b.setAttribute('data-kind', 'type'); b.setAttribute('data-value', t);
      b.setAttribute('aria-pressed', 'false'); b.textContent = t;
      b.addEventListener('click', function () {
        state.filterType = (state.filterType === t) ? '' : t;
        renderAll();
      });
    });
    STATUS_OPTIONS.forEach(function (s) {
      var b = el('button', 'chip', statusWrap);
      b.type = 'button'; b.setAttribute('data-kind', 'status'); b.setAttribute('data-value', s);
      b.setAttribute('aria-pressed', 'false'); b.textContent = s;
      b.addEventListener('click', function () {
        state.filterStatus = (state.filterStatus === s) ? '' : s;
        renderAll();
      });
    });
  }

  function boot() {
    buildChips();

    var input = document.getElementById('searchInput');
    input.addEventListener('input', function () { state.search = this.value; renderAll(); });
    document.getElementById('searchClear').addEventListener('click', function () {
      state.search = ''; input.value = ''; renderAll(); input.focus();
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
      state.search = ''; input.value = ''; state.filterType = ''; state.filterStatus = '';
      state.openMonths = {};
      renderAll();
    });

    document.querySelectorAll('.chips')[0].querySelector('.chip').addEventListener('click', function () {
      state.filterType = ''; renderAll();
    });
    document.querySelectorAll('.chips')[1].querySelector('.chip').addEventListener('click', function () {
      state.filterStatus = ''; renderAll();
    });

    document.getElementById('sheetClose').addEventListener('click', closeSheet);
    document.getElementById('sheetScrim').addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSheet();
      if (e.key === 'Tab' && document.getElementById('sheet').classList.contains('is-open')) {
        var f = document.getElementById('sheetPanel').querySelectorAll('button, [href], input, select, textarea');
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    refresh();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
